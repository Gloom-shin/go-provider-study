const curriculum = {
 "weeks": [
  {

     "concept": "Go는 구글이 만든 컴파일 언어예요. Java와 가장 큰 차이는 **JVM이 없다**는 점이에요. `go build`를 하면 운영체제별 실행 파일 하나가 나오고, 그 파일만 복사하면 어디서든 실행돼요. Terraform provider가 Go로 많이 만들어지는 이유도 이거예요. Terraform이 provider 실행 파일 하나만 내려받아 띄우면 되거든요.\n\n문법은 일부러 작게 만들어졌어요. 클래스, 상속, 오버로딩, 예외, 애노테이션이 없어요. 대신 struct, 인터페이스, 에러 반환값으로 같은 일을 해요. 처음에는 \"이게 다야?\" 싶은데, 읽는 사람 입장에서는 숨은 동작이 적어서 코드를 따라가기 쉬워요.\n\n| Go | Java/Gradle |\n|---|---|\n| go.mod | build.gradle (모듈 이름 + 의존성) |\n| go.sum | 의존성 lock 파일 |\n| package main + func main() | public static void main |\n| go run . | ./gradlew bootRun |\n| go build | ./gradlew build (결과는 exe 하나) |\n| gofmt | Spotless (Go는 포맷이 딱 하나로 정해져 있음) |\n\n**모듈**은 go.mod가 있는 폴더 전체예요. 첫 줄의 `module example.com/hello`가 모듈 이름이고, 다른 패키지를 import할 때 이 이름이 경로 앞부분이 돼요. 실행할 프로그램은 반드시 `package main` 안에 `func main()`이 있어야 해요.\n\n**gofmt**는 Go 표준 포맷터예요. 들여쓰기는 탭, 중괄호 위치도 하나로 정해져 있어서 팀마다 스타일 논쟁이 없어요. VS Code의 Go 확장은 저장할 때 자동으로 적용해 줘요.\n\n설치가 번거로우면 오늘은 **Go Playground(go.dev/play)**에서 해도 충분해요. 브라우저에서 코드를 붙여 넣고 Run을 누르면 실행되고, 테스트 함수도 돌려 줘요. Week 1 실습은 전부 Playground로 할 수 있어요.",
     "code": [
      {
       "lang": "powershell",
       "text": "# 1) go.dev/dl 에서 Windows용 .msi를 받아 설치한 뒤, 새 터미널에서\ngo version\n\n# 2) 첫 모듈 만들기\nmkdir hello\ncd hello\ngo mod init example.com/hello"
      },
      {
       "lang": "go",
       "text": "// main.go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n\tname := \"Go\"\n\tfmt.Printf(\"안녕하세요, %s!\\n\", name)\n}"
      },
      {
       "lang": "powershell",
       "text": "go run .        # 컴파일 후 바로 실행\ngo build        # hello.exe 생성\ngofmt -l .      # 포맷이 안 맞는 파일 목록\ngofmt -w .      # 포맷 적용"
      }
     ],
     "confusions": [
      "`go run main.go`와 `go run .`은 달라요. 파일이 여러 개인 패키지는 `go run .`처럼 폴더를 넘겨야 다른 파일의 함수까지 같이 컴파일돼요.",
      "중괄호 `{`를 다음 줄에 쓰면 컴파일 에러가 나요. Go는 줄 끝에 세미콜론을 자동으로 넣기 때문에 `func main()` 뒤에 줄을 바꾸면 문장이 끝난 것으로 봐요.",
      "안 쓰는 import나 안 쓰는 지역 변수가 있으면 경고가 아니라 **컴파일 에러**예요. 잠깐 막아 두려면 `_ = x`처럼 빈 식별자에 대입해요."
     ],
     "quiz": [
      {
       "q": "go.mod 파일의 역할로 가장 가까운 것은?",
       "options": [
        "Dockerfile",
        "build.gradle",
        "application.properties",
        ".gitignore"
       ],
       "answer": 1,
       "explain": "모듈 이름과 의존성 버전을 적는 파일이라 build.gradle에 해당해요. go.sum은 lock 파일 역할이에요."
      },
      {
       "q": "안 쓰는 import가 남아 있을 때 Go 컴파일러는?",
       "options": [
        "경고만 출력",
        "자동으로 지움",
        "컴파일 에러",
        "런타임에 에러"
       ],
       "answer": 2,
       "explain": "Go는 안 쓰는 import와 지역 변수를 컴파일 에러로 처리해요."
      },
      {
       "q": "실행 가능한 프로그램의 진입점 함수가 들어가야 하는 패키지 이름은?",
       "short": true,
       "answer": "main",
       "explain": "package main 안의 func main()이 진입점이에요."
      }
     ]
    },
    {
     "id": 2,
     "title": "변수, 타입, zero value, 공개 범위",
     "goal": "변수 선언 두 가지 방식과 zero value를 이해하고, 대소문자로 공개 범위가 정해지는 규칙을 익혀요.",
     "concept": "변수는 두 가지로 선언해요. `var count int`처럼 타입을 적는 방식과, `count := 0`처럼 값에서 타입을 추론하는 **짧은 선언**이에요. `:=`는 함수 안에서만 쓸 수 있고, 패키지 수준(함수 밖)에서는 `var`를 써야 해요.\n\nGo에는 null이 들어간 \"초기화 안 된 변수\"가 없어요. 선언만 하면 타입별 **zero value**가 자동으로 들어가요. 문자열은 `\"\"`, 숫자는 `0`, bool은 `false`, 포인터·슬라이스·맵·인터페이스는 `nil`이에요. struct는 모든 필드가 각자의 zero value로 채워져요.\n\nzero value는 편리하지만 버그의 원인도 돼요. 예를 들어 `var state Model`이라고 선언만 하고 실제 값을 읽어 오는 걸 잊으면, 컴파일러는 아무 말도 안 해요. 그 상태로 비교하면 \"모든 필드가 빈 값\"인 state와 비교하게 돼요. Week 2에서 이 패턴이 실제 provider 버그로 나와요.\n\n**공개 범위는 이름의 첫 글자로 정해요.** 대문자로 시작하면 다른 패키지에서 보이고(exported), 소문자면 같은 패키지 안에서만 보여요. struct 필드도 마찬가지예요. `public`, `private` 키워드가 없어요.\n\n| Go | Java |\n|---|---|\n| func CreateCommands() | public 메서드 |\n| func extractData() | package-private 메서드 |\n| type Model struct { Name string } | public 필드 |\n| type Model struct { name string } | package-private 필드 |\n\n타입 변환은 항상 명시적이에요. int와 int64를 그냥 더할 수 없고 `int64(a) + b`처럼 바꿔야 해요. 숫자와 문자열 사이는 `strconv` 패키지를 써요. `strconv.Itoa(10)`은 \"10\", `strconv.Atoi(\"10\")`은 10과 에러를 돌려줘요.\n\n상수는 `const`로 선언해요. 여러 개를 묶을 때는 괄호를 써요. Java의 enum 대신 상수 묶음을 쓰는 경우가 많아요.",
     "code": [
      {
       "lang": "go",
       "text": "package main\n\nimport (\n\t\"fmt\"\n\t\"strconv\"\n)\n\nconst DefaultVRF = \"default\" // 대문자: 다른 패키지에서 보임\n\ntype Loopback struct {\n\tID   string\n\tCidr string\n\tVRF  string\n}\n\nfunc main() {\n\tvar lb Loopback         // 선언만: 모든 필드가 \"\"\n\tfmt.Printf(\"%+v\\n\", lb) // {ID: Cidr: VRF:}\n\n\tlb.ID = \"1\"\n\tvrf := lb.VRF // 짧은 선언, 타입은 string으로 추론\n\tif vrf == \"\" {\n\t\tvrf = DefaultVRF\n\t}\n\tfmt.Println(lb.ID, vrf)\n\n\tn, err := strconv.Atoi(\"42\")\n\tfmt.Println(n+1, err) // 43 <nil>\n\tfmt.Println(\"Loopback\" + strconv.Itoa(n))\n}"
      }
     ],
     "confusions": [
      "`x := 1`을 같은 범위에서 두 번 쓰면 에러예요. 이미 있는 변수에는 `=`를 써요. 단, 왼쪽에 새 변수가 하나라도 있으면 `a, err := ...`처럼 다시 `:=`를 쓸 수 있어요. 그래서 `err`가 여러 번 `:=`로 등장해도 정상이에요.",
      "`%v`는 값, `%+v`는 struct 필드 이름까지, `%q`는 따옴표로 감싼 문자열을 출력해요. 빈 문자열을 디버깅할 때 `%q`가 특히 유용해요.",
      "문자열 비교는 `==`로 해요. Java처럼 `.equals()`를 쓸 필요가 없어요."
     ],
     "quiz": [
      {
       "q": "`var s string`으로 선언만 한 변수 s의 값은?",
       "options": [
        "nil",
        "\"\" (빈 문자열)",

       ],
       "answer": 2,

       "short": true,
       "answer": "Atoi, strconv.Atoi",
       "explain": "Atoi는 ASCII to integer의 줄임말이에요. 반대 방향은 Itoa예요."
      }
     ]
    },
    {
     "id": 3,

     "concept": "리소스 파일은 항상 같은 틀이에요. 하나를 이해하면 나머지도 같은 순서로 읽혀요.\n\n| 구성 요소 | 하는 일 |\n|---|---|\n| var _ resource.Resource = ... | 인터페이스 구현 컴파일 확인 |\n| XxxResource struct | 리소스 본체. 보통 클라이언트를 필드로 가짐 |\n| XxxResourceModel struct | 속성 값을 담는 그릇. tfsdk 태그로 HCL과 연결 |\n| Metadata | 리소스 타입 이름 (provider이름_리소스이름) |\n| Schema | 속성 목록과 각 속성의 성격 |\n| Configure | provider가 만든 클라이언트를 받음 |\n| Create / Read / Update / Delete | 실제 작업 |\n| ImportState | terraform import 지원 |\n\nModel의 필드 타입은 Go의 string이 아니라 **types.String**이에요. Terraform 값은 \"설정 안 함(null)\"과 \"아직 모름(unknown)\" 상태가 있어서, 일반 string으로는 표현이 안 되기 때문이에요. 숫자는 types.Int64, 불린은 types.Bool을 써요.\n\nSchema에서 각 속성은 세 가지 성격 중 하나예요.\n\n| 성격 | 누가 값을 정하나 | 예 |\n|---|---|---|\n| Required | 사용자(HCL)가 반드시 | loopback_id |\n| Optional | 사용자가 넣을 수도 안 넣을 수도 | cidr, vrf_name |\n| Computed | provider가 정함 | id, 장비가 정하는 MAC 주소 |\n| Optional + Computed | 사용자가 안 넣으면 provider가 채움 | 기본값이 있는 속성 |\n\n**Computed 속성은 provider의 책임**이에요. 사용자가 HCL에서 값을 넣을 수 없고, Create가 끝날 때 provider가 반드시 채워야 해요. 이 약속을 어기면 무슨 일이 생기는지 Day 11에서 봐요.\n\n**plan modifier**는 plan 단계에서 값을 어떻게 보여 줄지 정해요. 두 가지는 꼭 알아 두세요. `stringplanmodifier.UseStateForUnknown()`은 이미 만든 리소스의 Computed 값을 plan에서 \"(known after apply)\" 대신 이전 값으로 보여 줘요. id에 거의 항상 붙여요. `stringplanmodifier.RequiresReplace()`는 그 속성이 바뀌면 Update 대신 지우고 다시 만들게 해요. loopback 번호처럼 바꾸면 사실상 다른 리소스가 되는 속성에 붙여요.",

       "text": "var _ resource.Resource = &LoopbackResource{}\n\ntype LoopbackResource struct {\n\tdevices map[string]*Client\n}\n\ntype LoopbackResourceModel struct {\n\tID         types.String `tfsdk:\"id\"`\n\tLoopbackID types.String `tfsdk:\"loopback_id\"`\n\tCidr       types.String `tfsdk:\"cidr\"`\n\tVRFName    types.String `tfsdk:\"vrf_name\"`\n\tDevice     types.String `tfsdk:\"device\"`\n}\n\nfunc NewLoopbackResource() resource.Resource {\n\treturn &LoopbackResource{}\n}\n\nfunc (r *LoopbackResource) Metadata(ctx context.Context, req resource.MetadataRequest, resp *resource.MetadataResponse) {\n\tresp.TypeName = req.ProviderTypeName + \"_loopback\" // arista_loopback\n}\n\nfunc (r *LoopbackResource) Schema(ctx context.Context, req resource.SchemaRequest, resp *resource.SchemaResponse) {\n\tresp.Schema = schema.Schema{\n\t\tAttributes: map[string]schema.Attribute{\n\t\t\t\"id\": schema.StringAttribute{\n\t\t\t\tComputed: true,\n\t\t\t\tPlanModifiers: []planmodifier.String{\n\t\t\t\t\tstringplanmodifier.UseStateForUnknown(),\n\t\t\t\t},\n\t\t\t},\n\t\t\t\"loopback_id\": schema.StringAttribute{\n\t\t\t\tRequired: true,\n\t\t\t\tPlanModifiers: []planmodifier.String{\n\t\t\t\t\tstringplanmodifier.RequiresReplace(), // 번호가 바뀌면 새로 만듦\n\t\t\t\t},\n\t\t\t},\n\t\t\t\"cidr\":     schema.StringAttribute{Optional: true},\n\t\t\t\"vrf_name\": schema.StringAttribute{Optional: true},\n\t\t\t\"device\":   schema.StringAttribute{Optional: true},\n\t\t},\n\t}\n}\n\nfunc (r *LoopbackResource) Configure(ctx context.Context, req resource.ConfigureRequest, resp *resource.ConfigureResponse) {\n\tif req.ProviderData == nil { // plan 초기 단계에서는 nil로 한 번 불릴 수 있음\n\t\treturn\n\t}\n\tdevices, ok := req.ProviderData.(map[string]*Client)\n\tif !ok {\n\t\tresp.Diagnostics.AddError(\"Unexpected provider data\", fmt.Sprintf(\"got %T\", req.ProviderData))\n\t\treturn\n\t}\n\tr.devices = devices\n}"

    {
     "id": 11,
     "title": "CRUD 흐름과 plan/state · Create의 id 버그",
     "goal": "Create·Update·Delete에서 plan과 state를 읽고 쓰는 정확한 순서를 익히고, Computed id를 채우지 않아 apply가 실패하는 버그를 직접 고쳐요.",
     "concept": "CRUD 메서드는 모두 같은 흐름이에요. **요청에서 값을 읽고 → 장비에 작업하고 → 결과를 응답 state에 쓰고 → 문제가 있으면 Diagnostics에 에러를 남기고 return**해요.\n\n| 메서드 | 읽는 값 | 써야 하는 값 |\n|---|---|---|\n| Create | req.Plan (원하는 값) | resp.State (Computed 포함 전부) |\n| Read | req.State (지난번 값) | resp.State (장비의 실제 값) |\n| Update | req.Plan + req.State | resp.State |\n| Delete | req.State | (안 써도 됨, 성공하면 자동 제거) |\n\n**plan은 앞으로 원하는 값, state는 지난번에 저장한 값**이에요. Update에서 \"무엇이 바뀌었는지\" 알려면 둘을 모두 읽어서 비교해야 해요.\n\n에러는 예외를 던지는 대신 `resp.Diagnostics.AddError(제목, 내용)`로 쌓아요. framework가 함수가 끝난 뒤 Diagnostics를 보고 실패 여부를 판단해요. 그래서 AddError 다음에는 반드시 return이 와야 해요. return이 없으면 실패한 상태로 state 저장까지 진행돼요.\n\n이제 실제로 자주 나오는 버그 두 개를 봐요. 예제 1은 장비 명령은 성공했는데 apply가 실패하는 코드예요. Terraform은 이런 에러를 내요.\n\n```text\nError: Provider returned invalid result object after apply\nAfter the apply operation, the provider still indicated an unknown value for arista_loopback.router_id.id.\nAll values must be known after apply, so this is always a bug in the provider.\n```\n\nCreate가 시작될 때 Computed인 id는 unknown이에요. provider가 값을 넣지 않고 plan을 그대로 state에 저장하면 id가 unknown인 채로 남아요. 장비에는 loopback이 이미 생겼는데 Terraform은 run을 실패로 처리하고, 그 리소스를 추적하지 못하게 돼요.\n\n두 번째 버그는 Update에서 state를 읽지 않는 거예요. `var state Model`만 선언하고 `req.State.Get`을 빼먹으면 state의 모든 필드가 zero value예요(Day 2). \"이전 cidr과 새 cidr이 다르면 IP를 지우고 다시 넣는다\"는 로직이 매번 참이 되어, 다른 속성만 바꿔도 루프백 IP가 잠깐 빠졌다 들어가요. 루프백 IP를 BGP·OSPF router-id로 쓰고 있다면 라우팅에 영향을 줄 수 있어요.",
     "code": [
      {
       "lang": "go",
       "text": "// 예제 1: 버그 두 개를 찾아보세요 (읽기 전용)\nfunc (r *LoopbackResource) Create(ctx context.Context, req resource.CreateRequest, resp *resource.CreateResponse) {\n\tvar plan LoopbackResourceModel\n\tresp.Diagnostics.Append(req.Plan.Get(ctx, &plan)...)\n\tif resp.Diagnostics.HasError() {\n\t\treturn\n\t}\n\n\tclient := r.devices[plan.Device.ValueString()]\n\tif _, err := client.RunCmds(ctx, createCommands(plan)); err != nil {\n\t\tresp.Diagnostics.AddError(\"Error creating loopback\", err.Error())\n\t\treturn\n\t}\n\n\tresp.Diagnostics.Append(resp.State.Set(ctx, &plan)...)\n}\n\nfunc (r *LoopbackResource) Update(ctx context.Context, req resource.UpdateRequest, resp *resource.UpdateResponse) {\n\tvar plan, state LoopbackResourceModel\n\tresp.Diagnostics.Append(req.Plan.Get(ctx, &plan)...)\n\tif resp.Diagnostics.HasError() {\n\t\treturn\n\t}\n\n\t// updateCommands는 state.Cidr와 plan.Cidr가 다르면\n\t// \"no ip address\" 다음에 \"ip address <새 값>\"을 만들어요.\n\tclient := r.devices[plan.Device.ValueString()]\n\tif _, err := client.RunCmds(ctx, updateCommands(state, plan)); err != nil {\n\t\tresp.Diagnostics.AddError(\"Error updating loopback\", err.Error())\n\t\treturn\n\t}\n\n\tresp.Diagnostics.Append(resp.State.Set(ctx, &plan)...)\n}"

/* ===== 앱 로직 ===== */
const STORAGE_KEY = "goprovider14_v1";
const state = {
  current: 1,
  done: new Set()
};

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    state.current = obj.current || 1;
    state.done = new Set(obj.done || []);
  } catch(e) {}
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ current: state.current, done: [...state.done] }));
}

function allDays() {
  return curriculum.weeks.flatMap(w => w.days);
}
function getDay(id) {
  return allDays().find(d => d.id === id);
}

function renderSidebar() {
  const html = curriculum.weeks.map((w, wi) => {
    const days = w.days.map(d => {
      const isCur = d.id === state.current;
      const isDone = state.done.has(d.id);
      return `<button data-day="${d.id}" class="day-cell w-full text-left text-sm px-2 py-1.5 rounded-md flex items-center justify-between gap-2
        ${isCur ? 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 font-semibold' : 'hover:bg-slate-100 dark:hover:bg-slate-700'}">
        <span class="truncate">Day ${d.id}. ${d.title}</span>
        ${isDone ? '<span class="text-emerald-500">✓</span>' : '<span class="text-slate-300 dark:text-slate-600">○</span>'}
      </button>`;
    }).join("");
    return `<div>
      <div class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-1">Week ${wi+1}</div>
      <div class="text-xs text-slate-500 dark:text-slate-400 mb-2">${w.title.replace(/^Week \d+ — /, '')}</div>
      <div class="space-y-1">${days}</div>
    </div>`;
  }).join("");

  document.getElementById("sidebarNav").innerHTML = html;
  document.getElementById("sidebarNavMobile").innerHTML = html;

  document.querySelectorAll("[data-day]").forEach(btn => {
    btn.addEventListener("click", () => {
      goTo(parseInt(btn.dataset.day, 10));
      document.getElementById("drawer").classList.add("hidden");
    });
  });
}

function renderProgress() {
  const total = allDays().length;
  const done = state.done.size;
  const pct = Math.round(done / total * 100);
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressBarMobile").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${done}/${total}`;
  document.getElementById("progressTextMobile").textContent = `${done}/${total}`;
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inlineMd(s){return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code class="px-1 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-sm">$1</code>');}

function renderQuiz(quiz, dayId) {
  return quiz.map((q, i) => {
    const key = `q_${dayId}_${i}`;
    if (q.short) {
      return `<div class="border border-slate-200 dark:border-slate-700 rounded-lg p-4 bg-white dark:bg-slate-800">
        <p class="font-semibold mb-3">Q${i+1}. ${inlineMd(q.q)}</p>
        <div class="flex gap-2">
          <input class="quiz-short flex-1 rounded border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2 text-sm" placeholder="답을 입력하세요" data-key="${key}" data-answer="${escapeHtml(q.answer)}" />
          <button class="quiz-short-check px-3 py-2 rounded bg-slate-800 text-white text-sm dark:bg-slate-200 dark:text-slate-900" data-key="${key}">확인</button>
        </div>
        <p class="quiz-feedback mt-3 text-sm hidden" data-key="${key}"></p>
        <details class="mt-2 text-sm text-slate-500"><summary class="cursor-pointer hover:text-slate-700 dark:hover:text-slate-300">💡 해설 보기</summary><p class="mt-2">${escapeHtml(q.explain||'')}</p></details>
      </div>`;
    }
    const opts = q.options.map((o, oi) => `
      <button class="quiz-option w-full text-left px-3 py-2 rounded border border-slate-200 dark:border-slate-700 hover:border-emerald-400 text-sm" data-key="${key}" data-answer="${q.answer}" data-choice="${oi}">
        <span class="font-mono text-slate-400 mr-2">${String.fromCharCode(65+oi)}.</span>${escapeHtml(o)}
      </button>`).join("");
    return `<div class="border border-slate-200 dark:border-slate-700 rounded-lg p-4 bg-white dark:bg-slate-800">
      <p class="font-semibold mb-3">Q${i+1}. ${inlineMd(q.q)}</p>
      <div class="space-y-2">${opts}</div>
      <p class="quiz-feedback mt-3 text-sm hidden" data-key="${key}"></p>
      <details class="mt-2 text-sm text-slate-500"><summary class="cursor-pointer hover:text-slate-700 dark:hover:text-slate-300">💡 해설 보기</summary><p class="mt-2">${escapeHtml(q.explain||'')}</p></details>
    </div>`;
  }).join("");
}

function renderDay(id) {
  const d = getDay(id);
  if (!d) return;
  state.current = id;
  save();

  const weekIdx = curriculum.weeks.findIndex(w => w.days.some(x => x.id === id));
  const week = curriculum.weeks[weekIdx];

  const codes = (d.code || []).map((c, i) => `
    <div class="my-3">
      <div class="text-xs text-slate-400 mb-1 font-mono">예제 ${i+1}</div>
      <pre class="language-${c.lang}"><code class="language-${c.lang}">${escapeHtml(c.text)}</code></pre>
    </div>`).join("");

  const confusions = (d.confusions || []).map(c => `<li class="mb-2 leading-relaxed">${inlineMd(c)}</li>`).join("");

  const html = `
    <header class="mb-6">
      <div class="text-xs font-semibold text-emerald-600 dark:text-emerald-400">Week ${weekIdx+1} · ${week.title.replace(/^Week \d+ — /, '')}</div>
      <h2 class="text-2xl sm:text-3xl font-bold mt-1">Day ${d.id}. ${d.title}</h2>
    </header>

    <section class="mb-8">
      <h3 class="text-base font-bold mb-2">🎯 오늘의 목표</h3>
      <p class="text-slate-700 dark:text-slate-300 leading-relaxed">${inlineMd(d.goal)}</p>
    </section>

    <section class="mb-10">
      <h3 class="text-base font-bold mb-3">📖 핵심 개념</h3>
      <div class="prose-ko text-slate-700 dark:text-slate-300">${
        d.concept.split(/\n\n+/).map(p => {
          if (p.trim().startsWith("```")) {
            const lines = p.split("\n");
            const lang = lines[0].replace(/```/, "").trim() || "text";
            const body = lines.slice(1, -1).join("\n");
            return `<pre class="language-${lang}"><code class="language-${lang}">${escapeHtml(body)}</code></pre>`;
          }
          if (p.trim().startsWith("|")) {
            // simple markdown table
            const rows = p.trim().split("\n").map(r => r.trim()).filter(r => r);
            const head = rows[0].split("|").map(x=>x.trim()).filter(Boolean);
            const body = rows.slice(2).map(r => r.split("|").map(x=>x.trim()).filter(Boolean));
            return `<div class="overflow-x-auto my-3"><table class="text-sm border-collapse"><thead><tr>${head.map(h=>`<th class="border border-slate-300 dark:border-slate-600 px-3 py-1 bg-slate-100 dark:bg-slate-700 text-left">${escapeHtml(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td class="border border-slate-300 dark:border-slate-600 px-3 py-1">${inlineMd(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
          }
          return `<p>${escapeHtml(p).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code class="px-1 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-sm">$1</code>')}</p>`;
        }).join("")
      }</div>
    </section>

    <section class="mb-10">
      <h3 class="text-base font-bold mb-3">💻 실습 코드</h3>
      ${codes || '<p class="text-slate-500 text-sm">(코드 예제 없음)</p>'}
    </section>

    <section class="mb-10">
      <h3 class="text-base font-bold mb-3">🤔 자주 헷갈리는 것</h3>
      <ul class="list-disc list-inside text-slate-700 dark:text-slate-300 leading-relaxed pl-2">
        ${confusions || '<li class="text-slate-400">(없음)</li>'}
      </ul>
    </section>

    <section class="mb-10">
      <h3 class="text-base font-bold mb-3">✏️ 퀴즈</h3>
      <div class="space-y-3">${renderQuiz(d.quiz || [], d.id)}</div>
    </section>

    <section class="mb-10">
      <h3 class="text-base font-bold mb-3">✅ 진도 체크</h3>
      <p class="text-sm text-slate-500">
        ${state.done.has(d.id) ? '✓ 이 날은 완료로 표시돼 있어요. 하단에서 취소할 수 있어요.' : '아직 미완료예요. 하단의 \"오늘 완료\" 버튼으로 표시하세요.'}
      </p>
    </section>
  `;
  document.getElementById("content").innerHTML = html;

  // Prism highlight
  if (window.Prism) Prism.highlightAll();

  // Quiz handlers
  document.querySelectorAll(".quiz-option").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.key;
      const ans = parseInt(btn.dataset.answer, 10);
      const choice = parseInt(btn.dataset.choice, 10);
      const right = ans === choice;
      const fb = document.querySelector(`.quiz-feedback[data-key="${key}"]`);
      fb.classList.remove("hidden");
      fb.innerHTML = right
        ? '<span class="text-emerald-600 dark:text-emerald-400 font-semibold">정답이에요! 🎉</span>'
        : '<span class="text-rose-600 dark:text-rose-400 font-semibold">아쉬워요. 정답은 ' + String.fromCharCode(65+ans) + '번이에요.</span>';
      document.querySelectorAll(`.quiz-option[data-key="${key}"]`).forEach(b => {
        b.classList.remove("ring-2","ring-emerald-500","ring-rose-500");
        const c = parseInt(b.dataset.choice,10);
        if (c === ans) b.classList.add("ring-2","ring-emerald-500");
        else if (c === choice) b.classList.add("ring-2","ring-rose-500");
      });
    });
  });
  document.querySelectorAll(".quiz-short-check").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.key;
      const input = document.querySelector(`.quiz-short[data-key="${key}"]`);
      const userAns = (input.value || "").trim();
      const correct = (input.dataset.answer || "").trim();
      const fb = document.querySelector(`.quiz-feedback[data-key="${key}"]`);
      fb.classList.remove("hidden");
      const ok = userAns.toLowerCase() === correct.toLowerCase() || correct.split(",").map(s=>s.trim().toLowerCase()).includes(userAns.toLowerCase());
      fb.innerHTML = ok
        ? '<span class="text-emerald-600 dark:text-emerald-400 font-semibold">정답이에요! 🎉</span>'
        : `<span class="text-rose-600 dark:text-rose-400 font-semibold">아쉬워요. 정답: <code class="px-1 bg-slate-100 dark:bg-slate-700 rounded">${escapeHtml(correct)}</code></span>`;
    });
  });

  renderSidebar();
  renderProgress();
  updateNav();

  // 스크롤 위로
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function updateNav() {
  const ids = allDays().map(d => d.id);
  const idx = ids.indexOf(state.current);
  document.getElementById("prevDay").disabled = idx <= 0;
  document.getElementById("nextDay").disabled = idx >= ids.length - 1;
  document.getElementById("markDone").textContent = state.done.has(state.current) ? "완료 취소" : "오늘 완료 ✓";
  document.getElementById("markDone").classList.toggle("bg-emerald-500", !state.done.has(state.current));
  document.getElementById("markDone").classList.toggle("bg-slate-400", state.done.has(state.current));
}

function goTo(id) {
  if (!getDay(id)) return;
  renderDay(id);
}

/* 검색 */
function openSearch() {
  document.getElementById("searchModal").classList.remove("hidden");
  document.getElementById("searchInput").value = "";
  document.getElementById("searchResults").innerHTML = "";
  setTimeout(()=>document.getElementById("searchInput").focus(), 50);
}
function closeSearch() {
  document.getElementById("searchModal").classList.add("hidden");
}
function runSearch(q) {
  if (!q) { document.getElementById("searchResults").innerHTML = ""; return; }
  const lower = q.toLowerCase();
  const hits = [];
  allDays().forEach(d => {
    const corpus = [d.title, d.goal, d.concept, ...(d.confusions||[]), ...(d.code||[]).map(c=>c.text)].join("\n").toLowerCase();
    if (corpus.includes(lower)) {
      const idx = corpus.indexOf(lower);
      const around = corpus.substring(Math.max(0, idx-40), Math.min(corpus.length, idx+lower.length+40));
      const snippet = around.replace(new RegExp(lower.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'), m => `<mark class="search-hit">${m}</mark>`);
      hits.push({ id: d.id, title: d.title, snippet });
    }
  });
  document.getElementById("searchResults").innerHTML = hits.length
    ? hits.map(h => `<button class="search-hit-row block w-full text-left px-3 py-2 rounded hover:bg-slate-100 dark:hover:bg-slate-700" data-day="${h.id}">
        <div class="text-sm font-semibold">Day ${h.id}. ${escapeHtml(h.title)}</div>
        <div class="text-xs text-slate-500 truncate">...${h.snippet}...</div>
      </button>`).join("")
    : `<div class="text-sm text-slate-400 px-3 py-4">검색 결과 없음</div>`;
  document.querySelectorAll(".search-hit-row").forEach(r => r.addEventListener("click", () => {
    goTo(parseInt(r.dataset.day, 10));
    closeSearch();
  }));
}

document.addEventListener("DOMContentLoaded", () => {
  load();
  // dark mode init
  const saved = localStorage.getItem("goprov14_dark");
  if (saved === "1") document.documentElement.classList.add("dark");

  renderDay(state.current);

  document.getElementById("prevDay").addEventListener("click", () => {
    const ids = allDays().map(d => d.id);
    const idx = ids.indexOf(state.current);
    if (idx > 0) goTo(ids[idx-1]);
  });
  document.getElementById("nextDay").addEventListener("click", () => {
    const ids = allDays().map(d => d.id);
    const idx = ids.indexOf(state.current);
    if (idx < ids.length-1) goTo(ids[idx+1]);
  });
  document.getElementById("markDone").addEventListener("click", () => {
    if (state.done.has(state.current)) state.done.delete(state.current);
    else state.done.add(state.current);
    save();
    renderSidebar();
    renderProgress();
    updateNav();
  });
  document.getElementById("resetProgress").addEventListener("click", resetProgress);
  document.getElementById("resetProgressMobile").addEventListener("click", resetProgress);

  document.getElementById("darkToggle").addEventListener("click", () => {
    document.documentElement.classList.toggle("dark");
    localStorage.setItem("goprov14_dark", document.documentElement.classList.contains("dark") ? "1" : "0");
  });

  document.getElementById("hamburger").addEventListener("click", () => {
    document.getElementById("drawer").classList.remove("hidden");
  });
  document.getElementById("drawerBg").addEventListener("click", () => {
    document.getElementById("drawer").classList.add("hidden");
  });

  document.getElementById("searchBtn").addEventListener("click", openSearch);
  document.getElementById("searchBg").addEventListener("click", closeSearch);
  document.getElementById("searchInput").addEventListener("input", e => runSearch(e.target.value.trim()));

  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      openSearch();
    } else if (e.key === "Escape") {
      closeSearch();
    } else if (e.key === "ArrowLeft" && !isSearchOpen()) {
      const ids = allDays().map(d => d.id);
      const idx = ids.indexOf(state.current);
      if (idx > 0) goTo(ids[idx-1]);
    } else if (e.key === "ArrowRight" && !isSearchOpen()) {
      const ids = allDays().map(d => d.id);
      const idx = ids.indexOf(state.current);
      if (idx < ids.length-1) goTo(ids[idx+1]);
    }
  });
});

function isSearchOpen() {
  return !document.getElementById("searchModal").classList.contains("hidden");
}
function resetProgress() {
  if (!confirm("정말 모든 진도를 초기화할까요?")) return;
  state.done.clear();
  state.current = 1;
  save();
  renderDay(1);
}
</script>
